<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chenevia — sachet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --texte: #0f172a; --texte-2: #64748b; --bord: #e2e8f0; --fond: #f1f5f9; --bleu: #1e40af; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; background: var(--fond); color: var(--texte); }
    .test { background: #fef3c7; color: #92400e; text-align: center; font-size: 13px; font-weight: 600; padding: 8px 16px; }
    .page { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
    .logo { display: block; height: 30px; margin: 4px auto 28px; mix-blend-mode: multiply; }
    .carte { background: #fff; border: 1px solid var(--bord); border-radius: 20px; padding: 24px; margin-bottom: 16px; }
    .surtitre { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--texte-2); font-weight: 600; margin: 0 0 10px; }
    h1 { font-size: 34px; margin: 0; line-height: 1.1; }
    .poids { font-size: 22px; font-weight: 700; color: var(--bleu); margin-top: 6px; }
    .infos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
    .infos div { background: var(--fond); border-radius: 12px; padding: 12px 14px; }
    .infos small { display: block; color: var(--texte-2); font-size: 12px; margin-bottom: 2px; }
    .infos b { font-size: 15px; word-break: break-all; }
    .frise { list-style: none; margin: 0; padding: 0; position: relative; }
    .frise::before { content: ''; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px; background: var(--bord); }
    .frise li { position: relative; padding: 0 0 22px 36px; }
    .frise li:last-child { padding-bottom: 0; }
    .frise li::before {
      content: ''; position: absolute; left: 3px; top: 4px; width: 14px; height: 14px; border-radius: 50%;
      background: #fff; border: 3px solid var(--bleu);
    }
    .frise li.fin::before { background: var(--bleu); }
    .frise li.ancien::before { border-color: #94a3b8; border-style: dashed; }
    .frise .date { font-size: 13px; color: var(--texte-2); }
    .frise .titre { font-weight: 600; font-size: 17px; }
    .vide { color: var(--texte-2); font-size: 15px; line-height: 1.5; }
    .pied { text-align: center; color: #94a3b8; font-size: 12px; letter-spacing: .14em; margin-top: 28px; }
  </style>
</head>

    function introuvable() {
      afficher('<div class="carte"><h1 style="font-size:24px">Sachet introuvable</h1>'
        + '<p class="vide">Ce code ne correspond à aucun sachet enregistré. Vérifiez l\'étiquette ou contactez Chenevia. '
        + 'Un sachet tout juste conditionné peut mettre quelques minutes à apparaître.</p></div>');
    }
    function fiche(D) {
      var frise = [];
      try { frise = JSON.parse(D.frise || '[]'); } catch (x) {}
      var etapes = frise.map(function (x, i) {
        return '<li class="' + (i === frise.length - 1 ? 'fin' : '') + '"><div class="date">' + e(x.date) + '</div><div class="titre">' + e(x.titre) + '</div></li>';
      });
      if (D.lot_externe) {
        etapes.unshift('<li class="ancien"><div class="date">Avant la mise en sachet</div><div class="titre">Culture et transformation</div>'
          + '<div class="date">Lot d\'origine ' + e(D.lot_externe) + ' — historique détaillé bientôt disponible</div></li>');
      }
      afficher('<div class="carte"><p class="surtitre">Sachet</p><h1>' + e(D.variete) + '</h1><div class="poids">' + e(poids(D.poids_g)) + '</div>'
        + '<div class="infos"><div><small>Identifiant</small><b>' + e(D.id) + '</b></div>'
        + '<div><small>Année de culture</small><b>' + (D.annee_culture ? e(D.annee_culture) : '—') + '</b></div></div></div>'
        + '<div class="carte"><p class="surtitre">Parcours</p><ol class="frise">' + etapes.join('') + '</ol></div>'
        + '<div class="carte"><p class="surtitre">Analyses</p><p class="vide">Le certificat d\'analyse de ce lot sera bientôt consultable ici.</p></div>');
    }

    var id = identifiantDemande();
    if (!/^S\d{6}-\d{4}$/.test(id)) introuvable();
    else if (!URL_CSV) afficher('<div class="carte vide">Page en cours de mise en service.</div>');
    else {
      fetch(URL_CSV, { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (texte) {
          var D = lireCsv(texte).filter(function (l) { return String(l.id).toUpperCase() === id; })[0];
          D ? fiche(D) : introuvable();
        })
        .catch(function () { afficher('<div class="carte vide">Informations momentanément indisponibles. Réessayez dans quelques instants.</div>'); });
    }
