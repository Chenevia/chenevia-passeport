<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chenevia</title>
  <script>
    // Les QR des sachets (GS1 Digital Link …/01/<GTIN>/10/<lot>/21/<sachet>, ou …/s/<sachet>) arrivent ici : GitHub Pages sert
    // 404.html pour tout chemin inconnu. On renvoie vers la page unique index.html, pour qu'il n'y ait qu'UNE page à tenir à
    // jour (revue du 04/11/2026 : l'ancienne copie gardée ici n'avait ni le bandeau de rappel, ni l'arrondi du THC).
    (function () {
      var m = location.pathname.match(/\/21\/([^\/?#]+)/) || location.pathname.match(/\/s\/([^\/?#]+)/);
      location.replace('/' + (m ? '?s=' + m[1] : ''));
    })();
  </script>
</head>
<body></body>
</html>
