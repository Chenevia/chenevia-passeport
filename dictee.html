<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Chenevia — dictée</title>
  <style>
    /* Dictée des notes de l'appli Chenevia Production (R-DICT-1). L'appli tourne dans une boîte Google qui n'a pas le droit
       d'utiliser le micro : cette page, ouverte par le bouton 🎤 d'une note, écoute ici puis renvoie le texte à l'appli
       (message à la fenêtre qui l'a ouverte, sinon par l'adresse de l'appli). Aucune donnée n'est gardée ici. */
    :root { --texte: #0f172a; --texte-2: #52514e; --bord: #e2e8f0; --fond: #f1f5f9; --carte: #fff; --bleu: #2a78d6; --rouge: #b91c1c; --vert: #15803d; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--fond); color: var(--texte); }
    main { max-width: 560px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }
    h1 { font-size: 20px; margin: 4px 0 0; }
    #etat { color: var(--texte-2); font-size: 15px; min-height: 22px; }
    #texte { width: 100%; min-height: 180px; font: inherit; font-size: 18px; line-height: 1.4; padding: 12px; border: 1px solid var(--bord); border-radius: 12px; background: var(--carte); color: var(--texte); }
    button { font: inherit; font-weight: 700; border-radius: 14px; cursor: pointer; border: 1px solid var(--bord); background: var(--carte); color: var(--texte); min-height: 56px; }
    #micro { font-size: 22px; min-height: 96px; }
    #micro.ecoute { background: #fef2f2; border: 2px solid var(--rouge); color: var(--rouge); animation: pulse 1.2s infinite; }
    #envoyer { background: var(--vert); border-color: var(--vert); color: #fff; font-size: 19px; min-height: 64px; }
    #envoyer:disabled { opacity: .45; }
    .bas { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(185, 28, 28, .12); } }
  </style>
</head>
<body>
<main>
  <h1>🎤 Dictée de la note</h1>
  <div id="etat">Préparation…</div>
  <button type="button" id="micro">🎤 Parler</button>
  <textarea id="texte" placeholder="Le texte dicté s'écrit ici. Vous pouvez le corriger."></textarea>
  <div class="bas"><button type="button" id="annuler">Annuler</button><button type="button" id="envoyer" disabled>✓ Mettre dans la note</button></div>
</main>
<script>
(function () {
  var p = new URLSearchParams(location.search), code = p.get('c') || '', retour = p.get('r') || '';
  var $ = function (id) { return document.getElementById(id); };
  var etat = function (t) { $('etat').textContent = t; };
  // Seule l'appli Chenevia sur Google peut recevoir le texte (pas de renvoi vers une autre adresse).
  var retourValide = /^https:\/\/script\.google\.com\/(a\/macros\/[a-z0-9.-]+\/|macros\/)s\/[A-Za-z0-9_-]+\/exec$/.test(retour);
  if (!/^[a-f0-9]{16,40}$/.test(code) || !retourValide) { etat('Ouvrez cette page avec le bouton 🎤 d\'une note de l\'appli.'); $('micro').disabled = true; return; }
  var Reco = window.SpeechRecognition || window.webkitSpeechRecognition, reco = null, ecoute = false, base = '';
  var majBouton = function () { $('micro').classList.toggle('ecoute', ecoute); $('micro').textContent = ecoute ? '⏹ Arrêter' : '🎤 Parler'; $('envoyer').disabled = !$('texte').value.trim(); };
  $('texte').addEventListener('input', majBouton);
  function demarrer() {
    if (!Reco) { etat('Ce navigateur ne sait pas reconnaître la voix : ouvrez l\'appli avec Chrome ou Safari.'); return; }
    reco = new Reco(); reco.lang = 'fr-FR'; reco.continuous = true; reco.interimResults = true;
    base = $('texte').value ? $('texte').value.replace(/\s*$/, ' ') : '';
    reco.onresult = function (ev) {
      var fini = '', provisoire = '';
      for (var i = 0; i < ev.results.length; i++) (ev.results[i].isFinal ? (fini += ev.results[i][0].transcript) : (provisoire += ev.results[i][0].transcript));
      $('texte').value = base + fini + provisoire; majBouton();
    };
    reco.onerror = function (ev) {
      etat(ev.error === 'not-allowed' || ev.error === 'service-not-allowed' ? 'Micro refusé : autorisez le micro pour cette page, puis appuyez sur 🎤.'
        : ev.error === 'no-speech' ? 'Rien entendu : appuyez sur 🎤 et parlez.' : ev.error === 'network' ? 'Pas de réseau : la dictée a besoin d\'internet.' : 'Dictée interrompue (' + ev.error + ').');
    };
    reco.onend = function () { ecoute = false; majBouton(); if (/Parlez/.test($('etat').textContent)) etat($('texte').value.trim() ? 'Vérifiez le texte, puis « Mettre dans la note ».' : 'Appuyez sur 🎤 pour parler.'); };
    try { reco.start(); ecoute = true; etat('Parlez… (appuyez sur ⏹ quand vous avez fini)'); } catch (e) { etat('Appuyez sur 🎤 pour parler.'); }
    majBouton();
  }
  $('micro').onclick = function () { if (ecoute && reco) reco.stop(); else demarrer(); };
  $('annuler').onclick = function () { if (reco) reco.abort(); window.close(); etat('Vous pouvez fermer cet onglet.'); };
  // Envoi : d'abord à la fenêtre de l'appli qui a ouvert cette page (elle accuse réception) ; sinon, par l'adresse de l'appli.
  var recu = false;
  window.addEventListener('message', function (ev) { if (ev.data && ev.data.type === 'dictee-recue' && ev.data.code === code) { recu = true; window.close(); etat('✓ Texte mis dans la note. Vous pouvez fermer cet onglet.'); } });
  $('envoyer').onclick = function () {
    var texte = $('texte').value.trim().substring(0, 1500);
    if (!texte) return;
    if (reco) reco.abort();
    $('envoyer').disabled = true; etat('Envoi à l\'appli…');
    try { if (window.opener) window.opener.postMessage({ type: 'dictee-chenevia', code: code, texte: texte }, '*'); } catch (e) {}
    setTimeout(function () { if (!recu) location.href = retour + '?dictee=' + code + '&texte=' + encodeURIComponent(texte); }, 1500);
  };
  majBouton();
  demarrer();                                                            // écoute tout de suite (sinon : bouton 🎤)
})();
</script>
</body>
</html>
