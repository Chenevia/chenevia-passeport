<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chenevia — sachet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --texte: #0f172a; --texte-2: #52514e; --texte-3: #8a8985; --bord: #e2e8f0; --fond: #f1f5f9; --carte: #fff;
      --serie: #2a78d6; --serie-clair: #dbe8f8; --grille: #e5e7eb;
      --bon: #15803d; --bon-fond: #ecfdf5; --attention: #b45309; --attention-fond: #fffbeb; --critique: #b91c1c; --critique-fond: #fef2f2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; background: var(--fond); color: var(--texte); }
    .test { background: #fef3c7; color: #92400e; text-align: center; font-size: 13px; font-weight: 600; padding: 8px 16px; }
    .page { max-width: 620px; margin: 0 auto; padding: 24px 16px 48px; }
    .logo { display: block; height: 34px; margin: 6px auto 24px; mix-blend-mode: multiply; }
    .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 20px; padding: 22px; margin-bottom: 16px; }
    .surtitre { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--texte-2); font-weight: 600; margin: 0 0 12px; }
    h1 { font-size: 34px; margin: 0; line-height: 1.1; }
    h2 { font-size: 20px; margin: 0 0 4px; }
    .poids { font-size: 22px; font-weight: 700; color: var(--serie); margin-top: 6px; }
    .infos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
    .infos div { background: var(--fond); border-radius: 12px; padding: 10px 14px; }
    .infos small { display: block; color: var(--texte-2); font-size: 12px; margin-bottom: 2px; }
    .infos b { font-size: 15px; word-break: break-all; }
    .statut { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; margin-top: 16px; }
    .statut.bon { background: var(--bon-fond); color: var(--bon); }
    .statut.critique { background: var(--critique-fond); color: var(--critique); }
    .statut svg { width: 18px; height: 18px; }
    .exemple { background: var(--attention-fond); border: 1px solid #fcd34d; color: #78350f; border-radius: 14px; padding: 12px 16px; font-size: 14px; line-height: 1.5; margin-bottom: 16px; }
    .vide { color: var(--texte-2); font-size: 15px; line-height: 1.5; }
    .note { color: var(--texte-2); font-size: 13px; line-height: 1.5; margin: 12px 0 0; }

    /* Chiffres clés */
    .tuiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .tuile { background: var(--fond); border-radius: 14px; padding: 12px 14px; }
    .tuile small { display: block; font-size: 12px; color: var(--texte-2); font-weight: 600; }
    .tuile b { display: block; font-size: 26px; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .tuile span { font-size: 12px; color: var(--texte-3); }
    .metre { margin-top: 16px; }
    .metre-tete { display: flex; justify-content: space-between; font-size: 13px; color: var(--texte-2); margin-bottom: 6px; }
    .metre-piste { position: relative; height: 10px; background: var(--serie-clair); border-radius: 999px; }
    .metre-piste i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--serie); }
    .metre-limite { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--texte); }

    /* Barres */
    .barres { display: grid; gap: 8px; }
    .barre { display: grid; grid-template-columns: 112px 1fr 76px; gap: 10px; align-items: center; font-size: 14px; }
    .barre .nom { color: var(--texte); }
    .barre .nom small { display: block; color: var(--texte-3); font-size: 11px; }
    .piste { height: 12px; background: var(--fond); border-radius: 4px; overflow: hidden; }
    .piste i { display: block; height: 100%; background: var(--serie); border-radius: 0 4px 4px 0; }
    .barre .valeur { text-align: right; font-variant-numeric: tabular-nums; color: var(--texte-2); white-space: nowrap; }
    .barre.total .nom, .barre.total .valeur { font-weight: 700; color: var(--texte); }
    .barre.total { padding-top: 8px; border-top: 1px solid var(--bord); margin-top: 4px; }

    /* Toile terpènes */
    .toile { display: block; width: 100%; max-width: 480px; margin: 4px auto 0; overflow: visible; }
    .toile .anneau { fill: none; stroke: var(--grille); stroke-width: 1; }
    .toile .axe { stroke: var(--grille); stroke-width: 1; }
    .toile .zone { fill: var(--serie); fill-opacity: .16; stroke: var(--serie); stroke-width: 2; stroke-linejoin: round; }
    .toile .point { fill: var(--serie); stroke: var(--carte); stroke-width: 2; }
    .toile .point-cible { fill: transparent; cursor: pointer; }
    .toile text { font-family: inherit; fill: var(--texte); font-size: 20px; }
    .toile .echelle { fill: var(--texte-3); font-size: 13px; }
    .bulle { position: fixed; pointer-events: none; background: var(--texte); color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 13px; display: none; z-index: 5; }
    .terpenes { display: grid; gap: 8px; margin-top: 12px; }
    .terpene { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--bord); font-size: 14px; }
    .terpene:first-child { border-top: 0; }
    .terpene .note-aro { grid-column: 1 / -1; color: var(--texte-3); font-size: 12px; }
    .terpene b { font-variant-numeric: tabular-nums; }

    /* Certificats */
    .certificat { border: 1px solid var(--bord); border-radius: 14px; padding: 14px 16px; margin-top: 10px; }
    .certificat-tete { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .certificat dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0 0; font-size: 13px; }
    .certificat dt { color: var(--texte-2); }
    .certificat dd { margin: 0; font-variant-numeric: tabular-nums; }
    .bouton-pdf { display: inline-block; margin-top: 12px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--bord); color: var(--texte-3); font-size: 13px; font-weight: 600; }

    /* Parcours */
    .frise { list-style: none; margin: 0; padding: 0; position: relative; }
    .frise::before { content: ''; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px; background: var(--bord); }
    .frise li { position: relative; padding: 0 0 20px 36px; }
    .frise li:last-child { padding-bottom: 0; }
    .frise li::before { content: ''; position: absolute; left: 3px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--serie); }
    .frise li.fin::before { background: var(--serie); }
    .frise li.ancien::before { border-color: #94a3b8; border-style: dashed; }
    .frise li.analyse::before { border-color: var(--bon); }
    .frise .date { font-size: 13px; color: var(--texte-2); }
    .frise .titre { font-weight: 600; font-size: 16px; }
    .pied { text-align: center; color: #94a3b8; font-size: 12px; letter-spacing: .14em; margin-top: 28px; }
    .slogan { text-align: center; color: var(--texte-2); font-size: 13px; margin-top: 6px; }
    @media (max-width: 420px) {
      .tuiles { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
      .tuile b { font-size: 20px; }
      .barre { grid-template-columns: 96px 1fr 70px; gap: 8px; font-size: 13px; }
    }
  </style>
</head>

    function lireCsv(texte) {

        } else if (c === '"') guillemets = true;

          ligne.push(champ); lignes.push(ligne); ligne = []; champ = '';
        } else champ += c;
      }
      if (champ !== '' || ligne.length) { ligne.push(champ); lignes.push(ligne); }

        return '<polygon class="anneau" points="' + TERPENES.map(function (_, i) { return pt(i, R * k).join(','); }).join(' ') + '"/>';
      }).join('');
      var axes = TERPENES.map(function (_, i) { var p = pt(i, R); return '<line class="axe" x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '"/>'; }).join('');
      var zone = '<polygon class="zone" points="' + v.map(function (x, i) { return pt(i, R * x / max).join(','); }).join(' ') + '"/>';
      var points = v.map(function (x, i) {
        var p = pt(i, R * x / max), lib = TERPENES[i].nom + ' : ' + nombre(x, 1) + ' mg/g';
        return '<circle class="point" cx="' + p[0] + '" cy="' + p[1] + '" r="4"/>'
          + '<circle class="point-cible" cx="' + p[0] + '" cy="' + p[1] + '" r="16" data-bulle="' + e(lib) + '"><title>' + e(lib) + '</title></circle>';
      }).join('');
      var noms = TERPENES.map(function (t, i) {
        var p = pt(i, R + 18), ancre = Math.abs(p[0] - cx) < 8 ? 'middle' : p[0] > cx ? 'start' : 'end';
        return '<text x="' + p[0] + '" y="' + (p[1] + 4) + '" text-anchor="' + ancre + '">' + e(t.nom) + '</text>';
      }).join('');
      var echelle = '<text class="echelle" x="' + (cx + 6) + '" y="' + (cy - R + 16) + '">' + max + ' mg/g</text>';
      var tries = TERPENES.map(function (t, i) { return { t: t, v: v[i] }; }).sort(function (a, b) { return b.v - a.v; });
      return '<div class="carte"><p class="surtitre">Profil terpénique</p><h2>Les arômes de ce lot</h2>'
        + '<p class="note" style="margin-top:2px">Terpènes totaux : <b>' + nombre(total, 1) + ' mg/g</b>. Dominants : '
        + tries.slice(0, 3).map(function (x) { return e(x.t.nom.toLowerCase()); }).join(', ') + '.</p>'
        + '<svg class="toile" viewBox="0 0 500 420" role="img" aria-label="Profil terpénique en toile : ' + tries.map(function (x) { return x.t.nom + ' ' + nombre(x.v, 1) + ' mg/g'; }).join(', ') + '">'
        + anneaux + axes + zone + points + noms + echelle + '</svg>'
        + '<div class="terpenes">' + tries.map(function (x) {
          return '<div class="terpene"><span>' + e(x.t.nom) + '</span><b>' + nombre(x.v, 1) + ' mg/g</b><span class="note-aro">' + e(x.t.note) + '</span></div>';
        }).join('') + '</div></div>';
    }

    function sectionCertificats(A) {
      return '<div class="carte"><p class="surtitre">Certificats d\'analyse</p>'
        + A.certificats.map(function (c) {
          return '<div class="certificat"><div class="certificat-tete"><b>' + e(c.titre) + '</b><span class="note" style="margin:0">N° ' + e(c.numero) + '</span></div>'
            + '<dl><dt>Laboratoire</dt><dd>' + e(A.laboratoire) + '</dd><dt>Méthode</dt><dd>' + e(c.methode) + '</dd>'
            + '<dt>Prélèvement</dt><dd>' + dateFr(c.prelevement) + '</dd><dt>Réception labo</dt><dd>' + dateFr(c.reception) + '</dd>'
            + '<dt>Analyse</dt><dd>' + dateFr(c.analyse) + '</dd><dt>Édition</dt><dd>' + dateFr(c.edition) + '</dd></dl>'
            + (A.exemple ? '<span class="bouton-pdf">Certificat PDF : pas de document (exemple)</span>' : '') + '</div>';
        }).join('') + '</div>';
    }

    function sectionParcours(D, A) {
      var frise = [];
      try { frise = JSON.parse(D.frise || '[]'); } catch (x) {}
      var etapes = frise.map(function (x) { return { date: x.date, titre: x.titre, classe: '' }; });
      if (A && A.certificats.length) {
        var c = A.certificats[0];
        etapes.push({ date: dateFr(c.analyse), titre: 'Analyse en laboratoire' + (A.exemple ? ' (exemple)' : ''), classe: 'analyse' });
      }
      var tri = function (s) { var p = String(s).split('/'); return p.length === 3 ? p[2] + p[1] + p[0] : s; };
      etapes.sort(function (a, b) { return tri(a.date) < tri(b.date) ? -1 : 1; });
      var html = etapes.map(function (x, i) {
        return '<li class="' + x.classe + (i === etapes.length - 1 ? ' fin' : '') + '"><div class="date">' + e(x.date) + '</div><div class="titre">' + e(x.titre) + '</div></li>';
      });
      if (D.lot_externe) {
        html.unshift('<li class="ancien"><div class="date">Avant la mise en sachet</div><div class="titre">Culture et transformation</div>'
          + '<div class="date">Lot d\'origine ' + e(D.lot_externe) + ' — historique détaillé bientôt disponible</div></li>');
      }
      return '<div class="carte"><p class="surtitre">Parcours</p><ol class="frise">' + html.join('') + '</ol></div>';
    }

    // ---------- Page ----------
    function afficher(contenu) {
      document.getElementById('page').innerHTML = '<img class="logo" src="' + LOGO + '" alt="Chenevia">' + contenu
        + '<div class="pied">CHENEVIA · TRAÇABILITÉ</div><div class="slogan">Built on science · Designed for patients</div>';
    }
    function introuvable() {
      afficher('<div class="carte"><h1 style="font-size:24px">Sachet introuvable</h1>'
        + '<p class="vide">Ce code ne correspond à aucun sachet enregistré. Vérifiez l\'étiquette ou contactez Chenevia. '
        + 'Un sachet tout juste conditionné peut mettre quelques minutes à apparaître.</p></div>');
    }
    function fiche(D) {
      var A = null;
      try { A = D.analyses ? JSON.parse(D.analyses) : null; } catch (x) { A = null; }
      if (A) A.certificats.forEach(function (c) { ['prelevement', 'reception', 'analyse', 'edition'].forEach(function (k) { c[k] = new Date(c[k]); }); });
      else A = analyseExemple(D);
      var conforme = totaux(A.cannabinoides).thc <= LIMITE_THC;
      afficher('<div class="carte"><p class="surtitre">Sachet</p><h1>' + e(D.variete) + '</h1><div class="poids">' + e(poids(D.poids_g)) + '</div>'
        + '<div class="infos"><div><small>Identifiant</small><b>' + e(D.id) + '</b></div>'
        + '<div><small>Année de culture</small><b>' + (D.annee_culture ? e(D.annee_culture) : '—') + '</b></div></div>'
        + '<span class="statut ' + (conforme ? 'bon' : 'critique') + '">' + (conforme ? ICONE_OK + 'Analysé · conforme' : ICONE_NON + 'Analysé · non conforme') + '</span></div>'
        + (A.exemple ? '<div class="exemple">Exemple : les analyses et certificats ci-dessous sont <b>fictifs</b>. Ils montrent la présentation '
          + 'qu\'auront les résultats réels du laboratoire, une fois rattachés à ce lot.</div>' : '')
        + sectionChiffres(A) + sectionCannabinoides(A) + sectionTerpenes(A) + sectionCertificats(A) + sectionParcours(D, A));
      // Bulle au survol / au toucher des points de la toile
      var bulle = document.getElementById('bulle');
      document.querySelectorAll('[data-bulle]').forEach(function (p) {
        var montrer = function (ev) {
          var x = ev.touches ? ev.touches[0].clientX : ev.clientX, y = ev.touches ? ev.touches[0].clientY : ev.clientY;
          bulle.textContent = p.dataset.bulle; bulle.style.display = 'block';
          bulle.style.left = Math.min(x + 12, innerWidth - bulle.offsetWidth - 8) + 'px'; bulle.style.top = (y - 40) + 'px';
        };
        p.addEventListener('mousemove', montrer); p.addEventListener('touchstart', montrer, { passive: true });
        p.addEventListener('mouseleave', function () { bulle.style.display = 'none'; });
      });
      document.addEventListener('touchstart', function (ev) { if (!ev.target.closest('[data-bulle]')) bulle.style.display = 'none'; }, { passive: true });
    }

    var id = identifiantDemande();
    if (!/^S\d{6}-\d{4}$/.test(id)) introuvable();
    else if (!URL_CSV) afficher('<div class="carte vide">Page en cours de mise en service.</div>');
    else {
      fetch(URL_CSV, { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (texte) {
          var D = lireCsv(texte).filter(function (l) { return String(l.id).toUpperCase() === id; })[0];
          D ? fiche(D) : introuvable();
        })
        .catch(function () { afficher('<div class="carte vide">Informations momentanément indisponibles. Réessayez dans quelques instants.</div>'); });
    }
  </script>
</body>
</html>
